services:
  postgres:
    image: postgres:16-alpine
    container_name: green-lens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: green_lens
    ports:
      - "5434:5432"
    volumes:
      - green-lens-pg-data:/var/lib/postgresql/data

volumes:
  green-lens-pg-data:
